[project]
name = "Sunshine client"
version = "0.0.0"
description = "Sunshine game streaming client for desktop, Android, iOS/tvOS and the original Xbox."
repository = "https://github.com/SunshineStream/Sunshine-client"
logo = "sunshine-logo.svg"
favicon = "sunshine-logo.svg"

[build]
output = "_site"
work = ".dockle"
strict = true
clean = true

[[targets]]
name = "api"
title = "Sunshine documentation"
framework = "doxygen"
source = "."
home = true

[targets.doxygen]
inputs = [
  "README.md",
  "src",
  "experiments/README.md",
  "docs/test-android.md",
  "docs/test-apple-mobile.md",
]
image_paths = ["docs/images"]
predefined = ["NXDK"]
extra_stylesheets = [
  "https://cdn.jsdelivr.net/npm/@lizardbyte/shared-web@2026.1107.31840/dist/crowdin-dockle-css.css",
]
extra_javascript = [
  "https://cdn.jsdelivr.net/npm/@lizardbyte/shared-web@2026.1107.31840/dist/crowdin.js",
  "docs/crowdin.js",
]
main_page = "README.md"
