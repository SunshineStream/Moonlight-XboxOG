[project]
name = "Moonlight"
version = "0.0.0"
description = "Moonlight game streaming client for the original Xbox, desktop, mobile, and TV."
repository = "https://github.com/SunshineStream/Moonlight-XboxOG"
logo = "moonlight-logo.svg"
favicon = "moonlight-logo.svg"

[build]
output = "_site"
work = ".dockle"
strict = true
clean = true

[[targets]]
name = "api"
title = "Moonlight documentation"
framework = "doxygen"
source = "."
home = true

[targets.doxygen]
inputs = [
  "README.md",
  "src",
  "experiments/README.md",
  "docs/test-android.md",
  "docs/test-apple-mobile.md",
]
image_paths = ["docs/images"]
predefined = ["NXDK"]
extra_stylesheets = [
  "https://cdn.jsdelivr.net/npm/@lizardbyte/shared-web@2026.1107.31840/dist/crowdin-dockle-css.css",
]
extra_javascript = [
  "https://cdn.jsdelivr.net/npm/@lizardbyte/shared-web@2026.1107.31840/dist/crowdin.js",
  "docs/crowdin.js",
]
main_page = "README.md"
