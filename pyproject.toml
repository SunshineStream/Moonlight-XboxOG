[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Sunshine-client"
dynamic = ["version"]
description = "Python tooling for Sunshine-client"
requires-python = ">=3.14"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "LizardByte", email = "lizardbyte@users.noreply.github.com"}
]

dependencies = [
    "lizardbyte-common[c]",
]

[project.urls]
Homepage = "https://app.lizardbyte.dev"
Repository = "https://github.com/SunshineStream/Sunshine-client"
Issues = "https://github.com/SunshineStream/Sunshine-client/issues"

[tool.uv.sources]
lizardbyte-common = { path = "third-party/lizardbyte-common" }
