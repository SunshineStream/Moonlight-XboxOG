---
app-id: dev.lizardbyte.app.Moonlight
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: moonlight
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all  # SDL HIDAPI requires access to hidraw for advanced controller features.
modules:
  - modules/numactl.json
  - modules/ffmpeg.json
  - name: moonlight
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_NATIVE_CLIENT=ON
      - -DBUILD_XBOX=OFF
      - -DBUILD_DOCS=OFF
      - -DBUILD_TESTS=ON
      - -DMOONLIGHT_TEST_COVERAGE=ON
      - -DCMAKE_BUILD_TYPE=Release
      - -DFFMPEG_PREPARED_BINARIES=/app/ffmpeg
      - -DFETCHCONTENT_SOURCE_DIR_OPENSSL=/run/build/moonlight/deps/openssl
      - -DFETCHCONTENT_SOURCE_DIR_MOONLIGHT-COMMON-C=/run/build/moonlight/deps/moonlight-common-c
      - -DFETCHCONTENT_SOURCE_DIR_TOMLPLUSPLUS=/run/build/moonlight/deps/tomlplusplus
      - -DFETCHCONTENT_SOURCE_DIR_LUCIDE=/run/build/moonlight/deps/lucide
      - -DFETCHCONTENT_SOURCE_DIR_SDL3=/run/build/moonlight/deps/sdl
      - -DFETCHCONTENT_SOURCE_DIR_SDL3_IMAGE=/run/build/moonlight/deps/sdl-image
      - -DFETCHCONTENT_SOURCE_DIR_SDL3_TTF=/run/build/moonlight/deps/sdl-ttf
    run-tests: true
    test-rule: ""
    test-commands:
      - bash "$FLATPAK_BUILDER_BUILDDIR/packaging/linux/flatpak/test.sh"
    sources:
      - type: git
        url: "@GITHUB_CLONE_URL@"
        commit: "@GITHUB_COMMIT@"
      - modules/moonlight/openssl.json
      - modules/moonlight/moonlight-common-c.json
      - modules/moonlight/tomlplusplus.json
      - modules/moonlight/lucide.json
      - modules/moonlight/sdl.json
      - modules/moonlight/sdl-image.json
      - modules/moonlight/sdl-ttf.json
cleanup:
  - /ffmpeg/include
  - /ffmpeg/lib
