import javax.inject.Inject

plugins {
    id 'com.android.application' version '9.5.3'
}

abstract class StageMoonlightAssets extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getStagedAssets()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void packageAssets() {
        fileSystemOperations.sync {
            from(stagedAssets)
            into(outputDirectory)
        }
    }
}

def sourceRoot = rootProject.file('../..')
def depsRoot = providers.gradleProperty('moonlightAndroidDeps').map { rootProject.file(it) }
    .getOrElse(new File(sourceRoot, 'cmake-build-android-deps'))
def sdlSource = providers.gradleProperty('moonlightSdlSource').map { rootProject.file(it) }.getOrNull()
if (sdlSource == null) {
    def sdlPin = new File(sourceRoot, 'package-lock.cmake').getText('UTF-8') =~ /(?m)^set\(SDL3_VERSION ([^)]+)\)/
    if (!sdlPin.find()) {
        throw new GradleException('Could not read SDL3_VERSION from package-lock.cmake.')
    }
    sdlSource = new File(depsRoot, "sources/sdl-release-${sdlPin.group(1)}")
}
if (!new File(depsRoot, 'lib/pkgconfig/libavcodec.pc').isFile() ||
    !new File(depsRoot, 'lib/libcrypto.a').isFile() ||
    !new File(sdlSource, 'android-project/app/src/main/java/org/libsdl/app/SDLActivity.java').isFile()) {
    throw new GradleException(
        'Prepare Android dependencies with scripts/build-client-deps.sh android <prefix> ' +
        'on Linux, macOS, or MSYS2 UCRT64. ' +
        "Gradle checked ${depsRoot} for FFmpeg and OpenSSL and ${sdlSource} for SDL3. " +
        'Set moonlightAndroidDeps and moonlightSdlSource in Gradle properties to override these paths.')
}
android {
    namespace = 'dev.lizardbyte.app.moonlight'
    compileSdk = 35
    buildToolsVersion = '36.0.0'
    enableKotlin = false
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId = 'dev.lizardbyte.app.moonlight'
        minSdk = 26
        targetSdk = 35
        versionCode = 1
        versionName = '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild.cmake {
            arguments '-DBUILD_CLIENT=ON', '-DBUILD_TESTS=OFF', '-DBUILD_DOCS=OFF',
                      '-DBUILD_XBOX=OFF', '-DANDROID_STL=c++_shared',
                      "-DOPENSSL_ROOT_DIR=${depsRoot}", "-DCMAKE_FIND_ROOT_PATH=${depsRoot}",
                      "-DFFMPEG_PREPARED_BINARIES=${depsRoot}",
                      "-DFETCHCONTENT_SOURCE_DIR_SDL3=${sdlSource}"
            targets 'moonlight_client', 'SDL3-shared'
        }
    }

    buildTypes {
        release {
            // CI and local sideloading can opt into test signing for the release variant.
            if (providers.gradleProperty('moonlightSignReleaseForTesting').getOrElse('false').toBoolean()) {
                signingConfig = signingConfigs.debug
            }
        }
    }

    externalNativeBuild.cmake {
        path = new File(sourceRoot, 'CMakeLists.txt')
        // Keep CMake's nested compiler checks within Windows path limits.
        buildStagingDirectory = new File(sourceRoot, 'cmake-build-android')
        version = '3.22.1'
    }

    sourceSets.main {
        java.srcDir new File(sdlSource, 'android-project/app/src/main/java')
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantName = variant.name.capitalize()
        def stagedAssets = layout.buildDirectory.dir("moonlight-assets/${variant.name}")
        variant.externalNativeBuild.arguments.add(
            "-DMOONLIGHT_CLIENT_ASSET_ROOT=${stagedAssets.get().dir('assets').asFile}".toString()
        )
        def packageAssets = tasks.register("stage${variantName}MoonlightAssets", StageMoonlightAssets) {
            dependsOn("externalNativeBuild${variantName}")
            it.stagedAssets.set(stagedAssets)
        }
        variant.sources.assets.addGeneratedSourceDirectory(packageAssets) { it.outputDirectory }
    }
}
