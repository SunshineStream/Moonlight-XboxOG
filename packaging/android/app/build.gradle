plugins {
    id 'com.android.application' version '8.7.3'
}

def sourceRoot = rootProject.file('../..')
def sdlSource = providers.gradleProperty('moonlightSdlSource').getOrNull()
def depsRoot = providers.gradleProperty('moonlightAndroidDeps').getOrNull()
if (sdlSource == null || depsRoot == null) {
    throw new GradleException('Set -PmoonlightSdlSource and -PmoonlightAndroidDeps to the prepared SDL3 source and Android dependency prefix.')
}
sdlSource = file(sdlSource)
depsRoot = file(depsRoot)
def packagedAssets = layout.buildDirectory.dir('moonlight-assets')

android {
    namespace = 'dev.lizardbyte.app.moonlight'
    compileSdk = 35
    buildToolsVersion = '35.0.0'
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId = 'dev.lizardbyte.app.moonlight'
        minSdk = 26
        targetSdk = 35
        versionCode = 1
        versionName = '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild.cmake {
            arguments '-DBUILD_CLIENT=ON', '-DBUILD_TESTS=OFF', '-DBUILD_DOCS=OFF',
                      '-DBUILD_XBOX=OFF', '-DANDROID_STL=c++_shared',
                      "-DOPENSSL_ROOT_DIR=${depsRoot}", "-DCMAKE_FIND_ROOT_PATH=${depsRoot}",
                      "-DFFMPEG_PREPARED_BINARIES=${depsRoot}",
                      "-DFETCHCONTENT_SOURCE_DIR_SDL3=${sdlSource}",
                      "-DMOONLIGHT_CLIENT_ASSET_ROOT=${packagedAssets.get().asFile}/assets"
            targets 'moonlight_client', 'SDL3-shared'
        }
    }

    externalNativeBuild.cmake {
        path = new File(sourceRoot, 'CMakeLists.txt')
        version = '3.22.1'
    }

    sourceSets.main {
        java.srcDir new File(sdlSource, 'android-project/app/src/main/java')
        assets.srcDir packagedAssets
    }

    applicationVariants.all { variant ->
        variant.mergeAssetsProvider.configure {
            dependsOn("externalNativeBuild${variant.name.capitalize()}")
        }
    }
}
