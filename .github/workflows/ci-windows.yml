---
name: CI-Windows
permissions: {}

on:
  workflow_call:
    inputs:
      publish_release:
        required: true
        type: boolean
      azure_signing_endpoint:
        required: false
        type: string
      azure_signing_account:
        required: false
        type: string
      azure_signing_cert_profile:
        required: false
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TENANT_ID:
        required: false

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            runner: windows-latest
            msystem: MINGW64
            packages: mingw-w64-x86_64
            runtime: mingw-w64-x86_64-gcc
          - arch: ARM64
            runner: windows-11-arm
            msystem: CLANGARM64
            packages: mingw-w64-clang-aarch64
            runtime: mingw-w64-clang-aarch64-compiler-rt
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c  # v2.34.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git make patch perl
            ${{ matrix.packages }}-clang ${{ matrix.packages }}-cmake ${{ matrix.packages }}-lld
            ${{ matrix.packages }}-ninja ${{ matrix.packages }}-pkgconf ${{ matrix.runtime }}
      - name: Build and stage
        run: |
          # Use Ninja in CI to avoid missing MinGW Makefiles dependency stamps on clean builds.
          cmake --preset client -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DMOONLIGHT_USE_PREBUILT_FFMPEG=ON
          cmake --build --preset client --parallel
          cmake --install cmake-build-client --prefix "$PWD/artifacts" --strip
      - name: Package Windows client
        if: '!inputs.publish_release'
        working-directory: artifacts/bin
        env:
          PACKAGE_NAME: Moonlight-Windows-${{ matrix.arch }}
        run: cmake -E tar c "../${PACKAGE_NAME}.zip" --format=zip Moonlight.exe assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: '!inputs.publish_release'
        with:
          name: Moonlight-Windows-${{ matrix.arch }}
          path: artifacts/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: inputs.publish_release
        with:
          name: Windows-signing-input-${{ matrix.arch }}
          path: artifacts/bin/
          if-no-files-found: error

  sign:
    name: Sign release binaries
    if: inputs.publish_release
    needs: build
    # The Azure signing client runs on x64 and can sign PE files for both architectures.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: Windows-signing-input-*
          path: artifacts
      - name: Sign Windows executable
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          endpoint: ${{ inputs.azure_signing_endpoint }}
          signing-account-name: ${{ inputs.azure_signing_account }}
          certificate-profile-name: ${{ inputs.azure_signing_cert_profile }}
          files-folder: ${{ github.workspace }}\artifacts
          files-folder-filter: exe
          files-folder-recurse: true
      - name: Package signed clients
        working-directory: artifacts
        shell: bash
        run: |
          for arch in AMD64 ARM64; do
            (
              cd "Windows-signing-input-${arch}"
              cmake -E tar c "../Moonlight-Windows-${arch}.zip" --format=zip Moonlight.exe assets
            )
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Moonlight-Windows-AMD64
          path: artifacts/Moonlight-Windows-AMD64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Moonlight-Windows-ARM64
          path: artifacts/Moonlight-Windows-ARM64.zip
          if-no-files-found: error
