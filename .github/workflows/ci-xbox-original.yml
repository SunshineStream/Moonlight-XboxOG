---
name: CI-Xbox Original
permissions: {}

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  build:
    name: ${{ matrix.toolchain }} toolchain
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            toolchain: macOS
            shell: "bash"
          - os: ubuntu-latest
            toolchain: Linux
            shell: "bash"
          - os: windows-latest
            toolchain: Windows
            shell: "msys2 {0}"
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CMAKE_BUILD: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Setup Dependencies Linux
        if: runner.os == 'Linux'
        run: |
          nxdk_dependencies=(
            "bison"
            "build-essential"
            "clang"
            "cmake"
            "flex"
            "git"
            "lld"
            "llvm"
            "nasm"
          )
          sunshine_dependencies=(
            "patch"
          )
          dependencies=("${nxdk_dependencies[@]}" "${sunshine_dependencies[@]}")
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "${dependencies[@]}"

      - name: Setup Dependencies macOS
        if: runner.os == 'macOS'
        run: |
          nxdk_dependencies=(
            "cmake"
            "coreutils"
            "lld"
            "llvm"
            "nasm"
          )
          sunshine_dependencies=(
          )
          dependencies=("${nxdk_dependencies[@]}" "${sunshine_dependencies[@]}")
          brew install "${dependencies[@]}"

      - name: Setup Dependencies Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c  # v2.34.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            bison
            diffutils
            flex
            git
            make
            patch
            perl
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-compiler-rt
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-llvm-tools
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-nasm

      - name: Build
        run: |
          chmod +x build.sh
          coverage=(--coverage)
          if [[ "${RUNNER_OS}" == Linux ]]; then
            coverage+=(--xbox-coverage)
          fi
          ./build.sh --build-dir "${CMAKE_BUILD}" "${coverage[@]}"

          # recursively list all files in build directory
          ls -R "${CMAKE_BUILD}"

          # move artifacts
          mkdir -p artifacts
          tar -czf artifacts/Sunshine-client-XboxOG-XBE.tar.gz "./${CMAKE_BUILD}/xbox/xbe"
          cp "${CMAKE_BUILD}/xbox/Sunshine.iso" artifacts/Sunshine-client-XboxOG.iso

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Sunshine-client-XboxOG-${{ runner.os }}
          path: artifacts/

      - name: Test and report coverage
        uses: ./.github/actions/test-and-report
        with:
          build-dir: ${{ env.CMAKE_BUILD }}
          platform: Xbox-host-${{ runner.os }}
          test-shell: '${{ matrix.shell }}'
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

      - name: Set up xemu
        if: runner.os == 'Linux'
        env:
          SUNSHINE_XEMU_TAG: v0.8.139
        run: |
          sudo apt-get install --no-install-recommends -y libgl1-mesa-dri libglx-mesa0 xauth xvfb
          bash scripts/setup-xemu.sh

      - name: Run Xbox tests and recover guest coverage
        if: runner.os == 'Linux'
        id: guest-coverage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_AUDIO_DRIVER: dummy
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' \
            uv run --project third-party/lizardbyte-common --locked --no-sync \
            python scripts/run-xbox-coverage.py "${CMAKE_BUILD}/xbox"

      - name: Upload Xbox guest test and coverage artifacts
        if: >-
          ${{ !cancelled() &&
          (steps.guest-coverage.outcome == 'success' || steps.guest-coverage.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Tests-Xbox-guest-xemu
          path: |
            ${{ env.CMAKE_BUILD }}/xbox/xemu-coverage/*.log
            ${{ env.CMAKE_BUILD }}/xbox/xemu-coverage/test_results.xml
            ${{ env.CMAKE_BUILD }}/xbox/xemu-coverage/coverage.info
          if-no-files-found: error

      - name: Upload Xbox guest coverage to Codecov
        if: >-
          ${{ !cancelled() && startsWith(github.repository, 'SunshineStream/') &&
          hashFiles(format('{0}/xbox/xemu-coverage/coverage.info', env.CMAKE_BUILD)) != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ${{ env.CMAKE_BUILD }}/xbox/xemu-coverage/coverage.info
          flags: Xbox-guest-xemu
          report_type: coverage
          token: ${{ secrets.CODECOV_TOKEN }}
