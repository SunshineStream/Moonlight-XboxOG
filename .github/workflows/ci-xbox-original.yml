---
name: CI-Xbox Original
permissions: {}

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

env:
  PYTHON_VERSION: '3.14'

jobs:
  build:
    name: ${{ matrix.toolchain }} toolchain
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            toolchain: macOS
            shell: "bash"
          - os: ubuntu-latest
            toolchain: Linux
            shell: "bash"
          - os: windows-latest
            toolchain: Windows
            shell: "msys2 {0}"
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CMAKE_BUILD: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Setup Dependencies Linux
        if: runner.os == 'Linux'
        run: |
          nxdk_dependencies=(
            "bison"
            "build-essential"
            "clang"
            "cmake"
            "flex"
            "git"
            "lld"
            "llvm"
            "nasm"
          )
          moonlight_dependencies=(
            "patch"
          )
          dependencies=("${nxdk_dependencies[@]}" "${moonlight_dependencies[@]}")
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "${dependencies[@]}"

      - name: Setup Dependencies macOS
        if: runner.os == 'macOS'
        run: |
          nxdk_dependencies=(
            "cmake"
            "coreutils"
            "lld"
            "llvm"
            "nasm"
          )
          moonlight_dependencies=(
          )
          dependencies=("${nxdk_dependencies[@]}" "${moonlight_dependencies[@]}")
          brew install "${dependencies[@]}"

      - name: Setup Dependencies Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c  # v2.34.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            bison
            diffutils
            flex
            git
            make
            patch
            perl
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-llvm-tools
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-nasm

      - name: Setup python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true

      - name: Sync Python tools
        env:
          MSYS2_PATH_TYPE: inherit
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          uv sync --project third-party/lizardbyte-common --locked --only-group test-c \
            --no-python-downloads \
            --no-install-project

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh --build-dir ${CMAKE_BUILD}

          # recursively list all files in build directory
          ls -R ${CMAKE_BUILD}

          # move artifacts
          mkdir -p artifacts
          tar -czf artifacts/Moonlight-XboxOG-XBE.tar.gz "./${CMAKE_BUILD}/xbox/xbe"
          cp "${CMAKE_BUILD}/xbox/Moonlight.iso" artifacts/Moonlight-XboxOG.iso

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Moonlight-XboxOG-${{ runner.os }}
          path: artifacts/

      - name: Run tests
        id: test
        run: |
          ctest --test-dir "${CMAKE_BUILD}" --output-on-failure \
            --output-junit "${PWD}/${CMAKE_BUILD}/tests/test_results.xml"

      - name: Generate gcov report
        id: test_report
        # The Windows Clang host build does not enable gcov instrumentation.
        # any except canceled or skipped
        if: >-
          always() &&
          runner.os != 'Windows' &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          uv run --project third-party/lizardbyte-common --locked --no-sync gcovr ${CMAKE_BUILD} -r . \
            --filter src \
            --exclude-noncode-lines \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --verbose \
            --xml-pretty \
            -o "${CMAKE_BUILD}/coverage.xml"

      - name: Debug coverage file
        if: >-
          always() &&
          steps.test_report.outcome == 'success'
        run: cat "${CMAKE_BUILD}/coverage.xml"

      - name: Upload coverage
        # any except canceled or skipped
        if: >-
          always() &&
          steps.test_report.outcome == 'success' &&
          startsWith(github.repository, 'SunshineStream/')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./${{ env.CMAKE_BUILD }}/coverage.xml
          flags: ${{ runner.os }}
          report_type: coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload test results
        # any except canceled or skipped
        if: >-
          always() &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure') &&
          startsWith(github.repository, 'SunshineStream/')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./${{ env.CMAKE_BUILD }}/tests/test_results.xml
          flags: ${{ runner.os }}
          handle_no_reports_found: true
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
