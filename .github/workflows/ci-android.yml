---
name: CI-Android
permissions: {}

on:
  workflow_call:
    outputs:
      signed_apk:
        description: Whether the distribution-signed APK is available
        value: ${{ jobs.build.outputs.signed_apk }}
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    outputs:
      signed_apk: ${{ steps.apk.outputs.signed }}
    env:
      SIGN_ANDROID_FOR_TESTING: ${{ github.event_name == 'pull_request' }}
      ORG_GRADLE_PROJECT_moonlightVersionCode: ${{ github.run_number }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Read Android SDK versions
        id: sdk
        run: |
          property() {
            sed -n "s/^${1}=//p" packaging/android/gradle.properties
          }
          platform="$(property moonlightCompileSdk)"
          ndk="$(property moonlightNdk)"
          build_tools="$(property moonlightBuildTools)"
          cmake="$(property moonlightCmake)"
          : "${platform:?Missing moonlightCompileSdk}" "${ndk:?Missing moonlightNdk}" \
            "${build_tools:?Missing moonlightBuildTools}" "${cmake:?Missing moonlightCmake}"
          {
            echo "ndk=${ndk}"
            echo "build_tools=${build_tools}"
            packages="platform-tools platforms;android-${platform} build-tools;${build_tools}"
            echo "packages=${packages} ndk;${ndk} cmake;${cmake}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
        with:
          packages: ${{ steps.sdk.outputs.packages }}

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config

      - name: Configure native dependency build
        run: |
          cmake -S cmake/mobile-deps -B cmake-build-android-deps -G Ninja -DMOONLIGHT_MOBILE_TARGET=android

      - name: Build native dependencies
        env:
          NDK_VERSION: ${{ steps.sdk.outputs.ndk }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          cmake --build cmake-build-android-deps

      - name: Configure Android client
        run: bash packaging/android/gradlew -p packaging/android ':app:configureCMakeRelWithDebInfo[arm64-v8a]'

      - name: Build Android release packages
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: >-
            ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          tasks=(:app:assembleRelease)
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" ]]; then
            umask 077
            ANDROID_KEYSTORE="$(mktemp "${RUNNER_TEMP}/moonlight-android.XXXXXX")"
            export ANDROID_KEYSTORE
            trap 'rm -f -- "${ANDROID_KEYSTORE}"' EXIT
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${ANDROID_KEYSTORE}"
            unset ANDROID_KEYSTORE_BASE64
            tasks+=(:app:bundleRelease)
          fi
          bash packaging/android/gradlew -p packaging/android "${tasks[@]}" \
            "-PmoonlightSignReleaseForTesting=${SIGN_ANDROID_FOR_TESTING}"

      - name: Verify release APK
        id: apk
        env:
          BUILD_TOOLS_VERSION: ${{ steps.sdk.outputs.build_tools }}
        run: |
          apk_dir=packaging/android/app/build/outputs/apk/release
          build_tools="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          signed=false
          if [[ -f "${apk_dir}/app-release.apk" ]]; then
            apk="${apk_dir}/app-release.apk"
            artifact=Moonlight-Android
            "${build_tools}/apksigner" verify "${apk}"
            if [[ "${SIGN_ANDROID_FOR_TESTING}" == false ]]; then
              signed=true
            fi
          else
            test "${SIGN_ANDROID_FOR_TESTING}" == false
            apk="${apk_dir}/app-release-unsigned.apk"
            artifact=Moonlight-Android-unsigned
          fi
          badging=$("${build_tools}/aapt" dump badging "${apk}")
          if grep -qx 'application-debuggable' <<< "${badging}"; then
            echo "The Android release APK is debuggable." >&2
            exit 1
          fi
          {
            echo "path=${apk}"
            echo "artifact=${artifact}"
            echo "signed=${signed}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Verify signed app bundle
        if: steps.apk.outputs.signed == 'true'
        run: |
          jarsigner -J-Duser.language=en -verify packaging/android/app/build/outputs/bundle/release/app-release.aab |
            grep -F 'jar verified.'

      - name: Upload signed app bundle
        if: steps.apk.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Moonlight-Android-AppBundle
          path: packaging/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
