---
name: CI-macOS
permissions: {}

on:
  workflow_call:
    inputs:
      publish_release:
        required: true
        type: boolean
    secrets:
      CODECOV_TOKEN:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_NOTARYTOOL_PASSWORD:
        required: false
      APPLE_CODESIGN_IDENTITY:
        required: false
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64:
        required: false
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD:
        required: false

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
      - name: Install Apple certificate
        if: inputs.publish_release
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c  # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD }}
      - name: Build client and tests
        run: |
          brew install pkgconf
          cmake --preset client -DMOONLIGHT_USE_PREBUILT_FFMPEG=ON -DBUILD_TESTS=ON -DMOONLIGHT_TEST_COVERAGE=ON
          cmake --build cmake-build-client --parallel

      - name: Test and report coverage
        uses: ./.github/actions/test-and-report
        with:
          build-dir: cmake-build-client
          platform: macOS-${{ matrix.arch }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

      - name: Sign app
        if: inputs.publish_release
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp --sign "${APPLE_CODESIGN_IDENTITY}" \
            cmake-build-client/Moonlight.app
          codesign --verify --strict cmake-build-client/Moonlight.app
      - name: Package DMG
        env:
          PACKAGE_NAME: Moonlight-macOS-${{ matrix.arch }}
        run: >-
          cpack -G DragNDrop --config cmake-build-client/CPackConfig.cmake
          -B artifacts -D "CPACK_PACKAGE_FILE_NAME=${PACKAGE_NAME}"
      - name: Notarize and staple DMG
        if: inputs.publish_release
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARYTOOL_PASSWORD: ${{ secrets.APPLE_NOTARYTOOL_PASSWORD }}
        run: |
          dmg=(artifacts/*.dmg)
          codesign --force --timestamp --sign "${APPLE_CODESIGN_IDENTITY}" "${dmg[0]}"
          xcrun notarytool submit "${dmg[0]}" --wait --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" --password "${APPLE_NOTARYTOOL_PASSWORD}"
          xcrun stapler staple "${dmg[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Moonlight-macOS-${{ matrix.arch }}
          path: artifacts/*.dmg
