---
name: CI-macOS
permissions: {}

on:
  workflow_call:
    inputs:
      publish_release:
        required: true
        type: boolean
    secrets:
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_NOTARYTOOL_PASSWORD:
        required: false
      APPLE_CODESIGN_IDENTITY:
        required: false
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64:
        required: false
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD:
        required: false

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CMAKE_BUILD: cmake-build-client
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Install Apple certificate
        if: inputs.publish_release
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c  # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD }}

      - name: Install dependencies
        run: brew install pkgconf

      - name: Configure client and tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: cmake --preset client -DSUNSHINE_USE_PREBUILT_FFMPEG=ON -DBUILD_TESTS=ON -DSUNSHINE_TEST_COVERAGE=ON

      - name: Build client and tests
        run: cmake --build cmake-build-client --parallel

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: third-party/lizardbyte-common/uv.lock

      - name: Install coverage tools
        run: |
          uv sync --project third-party/lizardbyte-common --locked --only-group test-c \
            --no-python-downloads --no-install-project

      - name: Run unit tests
        id: tests
        run: |
          ctest --test-dir "${CMAKE_BUILD}" --output-on-failure \
            --output-junit "${PWD}/${CMAKE_BUILD}/test_results.xml"

      - name: Generate coverage report
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          uv run --project third-party/lizardbyte-common --locked --no-sync gcovr \
            "${CMAKE_BUILD}" -r . --gcov-executable 'xcrun llvm-cov gcov' --filter src \
            --exclude-noncode-lines --exclude-throw-branches --exclude-unreachable-branches \
            --lcov "${CMAKE_BUILD}/coverage.info.tmp"
          test -s "${CMAKE_BUILD}/coverage.info.tmp"
          mv "${CMAKE_BUILD}/coverage.info.tmp" "${CMAKE_BUILD}/coverage.info"

      - name: Upload test and coverage artifacts
        if: >-
          ${{ !cancelled() &&
          hashFiles('cmake-build-client/coverage.info', 'cmake-build-client/test_results.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Tests-macOS-${{ matrix.arch }}
          path: |
            ${{ env.CMAKE_BUILD }}/coverage.info
            ${{ env.CMAKE_BUILD }}/test_results.xml
          if-no-files-found: error

      - name: Sign app
        if: inputs.publish_release
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp --sign "${APPLE_CODESIGN_IDENTITY}" \
            cmake-build-client/SunshineClient.app
          codesign --verify --strict cmake-build-client/SunshineClient.app

      - name: Package DMG
        env:
          PACKAGE_NAME: Sunshine-client-macOS-${{ matrix.arch }}
        run: >-
          cpack -G DragNDrop --config cmake-build-client/CPackConfig.cmake
          -B artifacts -D "CPACK_PACKAGE_FILE_NAME=${PACKAGE_NAME}"

      - name: Notarize and staple DMG
        if: inputs.publish_release
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARYTOOL_PASSWORD: ${{ secrets.APPLE_NOTARYTOOL_PASSWORD }}
        run: |
          dmg=(artifacts/*.dmg)
          codesign --force --timestamp --sign "${APPLE_CODESIGN_IDENTITY}" "${dmg[0]}"
          xcrun notarytool submit "${dmg[0]}" --wait --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" --password "${APPLE_NOTARYTOOL_PASSWORD}"
          xcrun stapler staple "${dmg[0]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Sunshine-client-macOS-${{ matrix.arch }}
          path: artifacts/*.dmg
