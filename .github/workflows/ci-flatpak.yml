---
name: CI-Flatpak
permissions: {}

on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      FLATPAK_APP_ID: dev.lizardbyte.app.Moonlight
      FLATPAK_ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Flatpak SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --or-update flathub org.flatpak.Builder \
            "org.freedesktop.Platform/${FLATPAK_ARCH}/25.08" "org.freedesktop.Sdk/${FLATPAK_ARCH}/25.08"
      - name: Configure Flatpak manifest
        env:
          REPOSITORY_CLONE_URL: ${{ github.event.repository.clone_url }}
        run: |
          # Use the revision checked out by CI, including the merge commit for pull requests.
          commit="$(git rev-parse HEAD)"
          mkdir -p cmake-build-flatpak
          sed -e "s|@GITHUB_CLONE_URL@|${REPOSITORY_CLONE_URL}|g" -e "s|@GITHUB_COMMIT@|${commit}|g" \
            "packaging/linux/flatpak/${FLATPAK_APP_ID}.yml" > "cmake-build-flatpak/${FLATPAK_APP_ID}.yml"
          cp cmake/patches/sdl3-steam-controller-trigger-clicks-and-haptics.patch cmake-build-flatpak/
      - name: Build Flatpak
        working-directory: cmake-build-flatpak
        run: |
          sudo su "$(whoami)" -c "flatpak run org.flatpak.Builder \
            --arch=${FLATPAK_ARCH} --force-clean --repo=repo --sandbox \
            build-moonlight ${FLATPAK_APP_ID}.yml"
          sudo su "$(whoami)" -c "flatpak build-bundle --arch=${FLATPAK_ARCH} \
            repo ../Moonlight-${FLATPAK_ARCH}.flatpak ${FLATPAK_APP_ID}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Moonlight-Flatpak-${{ matrix.arch }}
          path: Moonlight-*.flatpak
