---
name: CI-Flatpak
permissions: {}

on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      FLATPAK_APP_ID: dev.lizardbyte.app.SunshineClient
      FLATPAK_ARCH: ${{ matrix.arch }}
      FLATPAK_BUILD_DIR: cmake-build-flatpak/.flatpak-builder/build/sunshine-client/_flatpak_build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Configure Flatpak manifest
        env:
          REPOSITORY_CLONE_URL: ${{ github.event.repository.clone_url }}
        run: |
          commit="$(git rev-parse HEAD)"
          mkdir -p cmake-build-flatpak
          cd cmake-build-flatpak || exit
          cmake "-DGITHUB_CLONE_URL=${REPOSITORY_CLONE_URL}" \
            "-DGITHUB_COMMIT=${commit}" -P ../packaging/linux/flatpak/configure.cmake

      - name: Install Flatpak SDK
        working-directory: cmake-build-flatpak
        run: |
          runtime_version="$(sed -nE "s/^runtime-version: '([^']+)'$/\1/p" "${FLATPAK_APP_ID}.yml")"
          test -n "${runtime_version}"
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --or-update flathub org.flatpak.Builder \
            "org.freedesktop.Platform/${FLATPAK_ARCH}/${runtime_version}" \
            "org.freedesktop.Sdk/${FLATPAK_ARCH}/${runtime_version}"

      - name: Build Flatpak
        working-directory: cmake-build-flatpak
        run: |
          sudo su "$(whoami)" -c "flatpak run org.flatpak.Builder \
            --arch=${FLATPAK_ARCH} --force-clean --keep-build-dirs --repo=repo --sandbox \
            build-sunshine-client ${FLATPAK_APP_ID}.yml"
          sudo su "$(whoami)" -c "flatpak build-bundle --arch=${FLATPAK_ARCH} \
            repo ../Sunshine-client-${FLATPAK_ARCH}.flatpak ${FLATPAK_APP_ID}"

      - name: Upload Flatpak
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Sunshine-client-Flatpak-${{ matrix.arch }}
          path: Sunshine-client-*.flatpak

      - name: Collect Flatpak test results
        id: tests
        if: ${{ !cancelled() && hashFiles(format('{0}/tests/test_results.xml', env.FLATPAK_BUILD_DIR)) != '' }}
        run: cp "${FLATPAK_BUILD_DIR}/tests/test_results.xml" "${FLATPAK_BUILD_DIR}/test_results.xml"

      - name: Setup Python
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Setup uv
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: third-party/lizardbyte-common/uv.lock

      - name: Generate Flatpak coverage report
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          set -euo pipefail
          uv sync --project third-party/lizardbyte-common --locked --only-group test-c \
            --no-build --no-python-downloads --no-install-project
          report="${PWD}/${FLATPAK_BUILD_DIR}/coverage.info"
          module_dir="$(realpath "${FLATPAK_BUILD_DIR}/..")"
          # The sandbox already generated gcov files using its own toolchain.
          uv run --directory "${module_dir}" --project "${PWD}/third-party/lizardbyte-common" \
            --locked --no-sync gcovr "${PWD}/${FLATPAK_BUILD_DIR}" -r . --gcov-use-existing-files --filter src \
            --exclude-noncode-lines --exclude-throw-branches --exclude-unreachable-branches --lcov "${report}.raw"
          awk -v root="${module_dir}/" '
            /^SF:/ {
              source = substr($0, 4)
              if (index(source, root) != 1) {
                print "Coverage source is outside the source tree: " source > "/dev/stderr"
                exit 1
              }
              $0 = "SF:" substr(source, length(root) + 1)
            }
            { print }
          ' "${report}.raw" > "${report}.tmp"
          grep -q '^SF:src/' "${report}.tmp"
          mv "${report}.tmp" "${report}"

      - name: Upload test and coverage artifacts
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Tests-Linux-${{ matrix.arch }}
          path: |
            ${{ env.FLATPAK_BUILD_DIR }}/coverage.info
            ${{ env.FLATPAK_BUILD_DIR }}/test_results.xml
          include-hidden-files: true
          if-no-files-found: error
